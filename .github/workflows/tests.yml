# Runs the checks and tests on GitHub every time changes are pushed.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl
          coverage: none
          tools: composer

      - name: Install PHPUnit and other dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: find public src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check public/app.js

      - name: Run tests
        run: composer test
