# Runs the checks and tests on GitHub every time changes are pushed.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl
          coverage: none
          tools: composer

      - name: Install Laravel, PHPUnit and other dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create Laravel's settings file and secret key
        run: cp .env.example .env && php artisan key:generate

      - name: Check PHP syntax
        run: find app config routes public src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check public/app.js

      - name: Run tests
        run: composer test

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install Laravel
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Create Laravel's settings file and secret key
        run: cp .env.example .env && php artisan key:generate

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Keep the test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
