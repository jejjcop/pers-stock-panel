# Week 3: an independent second-line reviewer in CI. It runs on every PR, human or agent,
# and has no access to the local factory's reasoning, so it's a genuinely separate check.
#
# Setup: add ANTHROPIC_API_KEY under repo Settings → Secrets and variables → Actions.
# Check the inputs against the current README at github.com/anthropics/claude-code-action.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for a Laravel app.
            Focus on correctness, OWASP security issues (authorization, injection, mass assignment, XSS)
            and scope creep. Leave inline comments only for real problems. End with a one-line verdict.
